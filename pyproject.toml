[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wecopttool"
version = "3.2.1"
description = "WEC Design Optimization Toolbox"
readme = "README.md"
authors = [
    {name = "Sandia National Laboratories"},
]
urls = {Documentation = "https://sandialabs.github.io/WecOptTool/"}
requires-python = ">=3.8"
license = {text = "GNU General Public License v3 (GPLv3)"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20",
    "scipy",
    "xarray",
    "jax",
    "capytaine==2.3.1",
    "joblib",
    "wavespectra>=4.0",
    "netcdf4",
    "multibody4everybody @ git+https://github.com/Project-SEA-Stack/Python_Multibody_for_Everybody.git@v2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "sphinx>=7,<8",
    "sphinx-multiversion",
    "sphinxcontrib-bibtex",
    "sphinx_rtd_theme",
    "jupyter",
    "nbsphinx",
    "pypandoc-binary",
    "imageio",
    "pygifsicle",
    "jinja2",
    "nbconvert",
    "wecopttool[geometry]",
]

geometry = [
    "matplotlib",
    "meshio",
    "gmsh",
    "pygmsh",
]

[tool.coverage.run]
source = [
    "wecopttool",
]